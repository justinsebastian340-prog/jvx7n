<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perceptuals | Automotive Wallpapers</title>
<link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #10110f;
    color: #f2f2ec;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   HEADER
========================= */

header {
    height: 70px;
    padding: 0 5%;
    border-bottom: 1px solid #30332d;

    display: flex;
    align-items: center;
    justify-content: space-between;

    position: sticky;
    top: 0;
    z-index: 50;

    background: rgba(16,17,15,.95);
    backdrop-filter: blur(15px);
}

.logo {
    font-weight: bold;
    letter-spacing: 1px;
}

.logo span {
    color: #d7f36a;
}

.header-text {
    color: #999c91;
    font-size: 11px;
    text-transform: uppercase;
}

/* =========================
   CONTAINER
========================= */

.container {
    width: 90%;
    max-width: 1500px;
    margin: auto;
}

/* =========================
   HERO
========================= */

.hero {
    padding: 70px 0 45px;
}

.hero small {
    color: #d7f36a;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.hero h1 {
    font-size: clamp(45px, 7vw, 90px);
    line-height: .95;
    font-weight: 500;
    margin: 20px 0;
}

.hero h1 em {
    color: #d7f36a;
    font-family: Georgia, serif;
}

.hero p {
    color: #999c91;
    max-width: 500px;
    line-height: 1.7;
}

/* =========================
   TOOLBAR
========================= */

.toolbar {
    border-top: 1px solid #30332d;
    padding: 25px 0;

    display: flex;
    justify-content: space-between;
    gap: 15px;
}

.search {
    width: 320px;
    height: 42px;

    background: #171916;
    border: 1px solid #30332d;

    color: white;

    padding: 0 15px;
    outline: none;
}

.search:focus {
    border-color: #d7f36a;
}

select {
    height: 42px;

    background: #171916;
    border: 1px solid #30332d;

    color: #aaa;

    padding: 0 14px;

    cursor: pointer;
}

select:hover {
    border-color: #d7f36a;
    color: white;
}

/* =========================
   GALLERY
========================= */

.gallery {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 16px;

    padding-bottom: 70px;
}

.card {
    position: relative;

    border: 1px solid #292c27;

    background: #171916;

    aspect-ratio: 4 / 5;

    overflow: hidden;

    cursor: pointer;

    padding: 0;

    color: white;

    text-align: left;
}

.card img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

    transition:
        transform .4s ease;
}

.card:hover img {
    transform: scale(1.05);
}

.card::after {
    content: "";

    position: absolute;

    inset: 40% 0 0;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.9)
        );

    pointer-events: none;
}

/* =========================
   CARD INFO
========================= */

.card-info {
    position: absolute;

    left: 15px;
    right: 15px;
    bottom: 15px;

    z-index: 2;
}

.card-title {
    font-size: 16px;
    font-weight: bold;

    margin-bottom: 5px;
}

.card-category {
    color: #bbbdb4;

    font-size: 10px;

    text-transform: uppercase;
}

/* =========================
   PREMIUM BADGE
========================= */

.card-tag {
    position: absolute;

    top: 12px;
    left: 12px;

    z-index: 3;

    background: rgba(10,10,10,.8);

    border: 1px solid
        rgba(215,243,106,.5);

    color: #d7f36a;

    padding: 6px 8px;

    font-size: 9px;

    text-transform: uppercase;
}

/* =========================
   LOADING / ERROR
========================= */

.loading,
.error,
.empty {
    grid-column: 1 / -1;

    padding: 70px 20px;

    text-align: center;

    color: #999c91;
}

.error strong,
.empty strong {
    display: block;

    color: white;

    margin-bottom: 10px;
}

/* =========================
   VIEWER
========================= */

.viewer {
    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.94);

    z-index: 1000;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;
}

.viewer.active {
    display: flex;
}

.viewer-box {
    width: min(1200px, 95vw);

    height: min(850px, 92vh);

    background: #171916;

    border: 1px solid #30332d;

    display: grid;

    grid-template-columns:
        1fr 300px;

    overflow: hidden;
}

/* =========================
   VIEWER IMAGE
========================= */

.viewer-image {
    background: #080908;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 25px;
}

.viewer-image img {
    max-width: 100%;
    max-height: 100%;

    object-fit: contain;
}

/* =========================
   VIEWER SIDE
========================= */

.viewer-side {
    border-left: 1px solid #30332d;

    padding: 30px;

    display: flex;

    flex-direction: column;
}

/* =========================
   CLOSE BUTTON
========================= */

.close {
    width: 40px;
    height: 40px;

    align-self: flex-end;

    background: transparent;

    border: 1px solid #30332d;

    color: white;

    cursor: pointer;

    font-size: 24px;
}

.close:hover {
    color: #d7f36a;

    border-color: #d7f36a;
}

/* =========================
   VIEWER TEXT
========================= */

.viewer-side h2 {
    font-size: 32px;

    margin-top: 40px;
}

.viewer-side p {
    color: #999c91;

    line-height: 1.6;

    font-size: 13px;
}

/* =========================
   VIEWER BUTTONS
========================= */

.viewer-buttons {
    margin-top: auto;
}

.download {
    width: 100%;
    height: 45px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #d7f36a;

    color: #151610;

    text-decoration: none;

    font-weight: bold;

    font-size: 12px;

    margin-bottom: 10px;
}

.navigation {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;
}

.navigation button {
    height: 42px;

    background: transparent;

    border: 1px solid #30332d;

    color: white;

    cursor: pointer;
}

.navigation button:hover {
    color: #d7f36a;

    border-color: #d7f36a;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 1000px) {

    .gallery {
        grid-template-columns:
            repeat(3, 1fr);
    }

}

@media (max-width: 700px) {

    .gallery {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .toolbar {
        flex-direction: column;
    }

    .search {
        width: 100%;
    }

    .viewer-box {
        grid-template-columns: 1fr;

        grid-template-rows:
            1fr auto;

        height: 95vh;

        overflow-y: auto;
    }

    .viewer-image {
        min-height: 55vh;
    }

    .viewer-side {
        border-left: 0;

        border-top:
            1px solid #30332d;
    }

}

@media (max-width: 450px) {

    .gallery {
        gap: 8px;
    }

    .container {
        width: 92%;
    }

}

</style>
</head>


<body>


<header>

    <div class="logo">
        <span>P</span>ERCEPTUALS
    </div>

    <div class="header-text">
        Automotive Wallpaper Archive
    </div>

</header>


<main class="container">


<section class="hero">

    <small>
        Wallpaper archive / 01
    </small>

    <h1>
        Made for the <em>drive.</em>
    </h1>

    <p>
        A curated collection of automotive wallpapers
        for your desktop and mobile screens.
    </p>

</section>


<section class="toolbar">

    <input
        id="search"
        class="search"
        type="search"
        placeholder="Search wallpapers..."
    >

    <select id="sort">

        <option value="default">
            Curated
        </option>

        <option value="az">
            A → Z
        </option>

        <option value="za">
            Z → A
        </option>

    </select>

</section>


<section
    id="gallery"
    class="gallery"
>

    <div class="loading">
        Loading wallpapers...
    </div>

</section>


</main>


<!-- =========================
     IMAGE VIEWER
========================= -->

<div
    id="viewer"
    class="viewer"
>


<div class="viewer-box">


    <div
        id="viewerImage"
        class="viewer-image"
    ></div>


    <div class="viewer-side">


        <button
            id="close"
            class="close"
            type="button"
        >
            ×
        </button>


        <div>

            <h2
                id="viewerTitle"
            ></h2>

            <p
                id="viewerCategory"
            ></p>

        </div>


        <div class="viewer-buttons">


            <a
                id="download"
                class="download"
                href="#"
                download
            >
                DOWNLOAD WALLPAPER
            </a>


            <div class="navigation">


                <button
                    id="previous"
                    type="button"
                >
                    ← Previous
                </button>


                <button
                    id="next"
                    type="button"
                >
                    Next →
                </button>


            </div>


        </div>


    </div>


</div>


</div>


<script>

/* =========================
   DATA
========================= */

let wallpapers = [];

let visibleWallpapers = [];

let currentWallpaper = null;


/* =========================
   ELEMENTS
========================= */

const gallery =
    document.getElementById("gallery");

const search =
    document.getElementById("search");

const sort =
    document.getElementById("sort");

const viewer =
    document.getElementById("viewer");

const viewerImage =
    document.getElementById("viewerImage");

const viewerTitle =
    document.getElementById("viewerTitle");

const viewerCategory =
    document.getElementById("viewerCategory");

const download =
    document.getElementById("download");

const close =
    document.getElementById("close");

const previous =
    document.getElementById("previous");

const next =
    document.getElementById("next");


/* =========================
   IMAGE PATH
========================= */

function getImagePath(filename) {

    return "wallpapers/" +
        String(filename)
            .trim()
            .split("/")
            .map(
                part =>
                    encodeURIComponent(part)
            )
            .join("/");

}


/* =========================
   LOAD JSON
========================= */

async function loadWallpapers() {

    try {

        const response =
            await fetch(
                "./wallpapers.json?v=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Could not load wallpapers.json. HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if (!Array.isArray(data)) {

            throw new Error(
                "wallpapers.json must contain a JSON array."
            );

        }


        wallpapers = data;


        render();


    } catch (error) {

        console.error(
            "Wallpaper loading error:",
            error
        );


        gallery.innerHTML = `

            <div class="error">

                <strong>
                    Could not load the collection.
                </strong>

                ${escapeHTML(error.message)}

            </div>

        `;

    }

}


/* =========================
   FILTER
========================= */

function getVisibleWallpapers() {

    const query =
        search.value
            .trim()
            .toLowerCase();


    let result =
        wallpapers.filter(
            item => {

                return (

                    String(
                        item.title || ""
                    )
                    .toLowerCase()
                    .includes(query)

                    ||

                    String(
                        item.category || ""
                    )
                    .toLowerCase()
                    .includes(query)

                );

            }
        );


    if (sort.value === "az") {

        result.sort(
            (a, b) =>
                String(a.title)
                    .localeCompare(
                        String(b.title)
                    )
        );

    }


    if (sort.value === "za") {

        result.sort(
            (a, b) =>
                String(b.title)
                    .localeCompare(
                        String(a.title)
                    )
        );

    }


    return result;

}


/* =========================
   RENDER GALLERY
========================= */

function render() {

    visibleWallpapers =
        getVisibleWallpapers();


    gallery.innerHTML = "";


    if (
        visibleWallpapers.length === 0
    ) {

        gallery.innerHTML = `

            <div class="empty">

                <strong>
                    No wallpapers found.
                </strong>

                Try another search.

            </div>

        `;

        return;

    }


    visibleWallpapers.forEach(
        item => {


            /*
             * Button instead of link.
             *
             * This prevents the browser
             * from navigating to a 404 page.
             */

            const card =
                document.createElement(
                    "button"
                );


            card.type =
                "button";


            card.className =
                "card";


            /* IMAGE */

            const image =
                document.createElement(
                    "img"
                );


            image.src =
                getImagePath(
                    item.preview
                );


            image.alt =
                item.title || "";


            image.loading =
                "lazy";


            image.onerror =
                function() {

                    console.error(
                        "Image failed to load:",
                        image.src
                    );

                };


            /* PREMIUM BADGE ONLY */

            if (item.premium) {

                const tag =
                    document.createElement(
                        "div"
                    );


                tag.className =
                    "card-tag";


                tag.textContent =
                    "Premium";


                card.appendChild(tag);

            }


            /* CARD INFORMATION */

            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "card-info";


            info.innerHTML = `

                <div class="card-title">

                    ${escapeHTML(
                        item.title || ""
                    )}

                </div>

                <div class="card-category">

                    ${escapeHTML(
                        item.category ||
                        "Automotive"
                    )}

                </div>

            `;


            card.appendChild(
                image
            );


            card.appendChild(
                info
            );


            /* OPEN VIEWER */

            card.addEventListener(
                "click",
                function(event) {

                    event.preventDefault();

                    openViewer(item);

                }
            );


            gallery.appendChild(
                card
            );

        }
    );

}


/* =========================
   OPEN VIEWER
========================= */

function openViewer(item) {

    currentWallpaper =
        item;


    const imagePath =
        getImagePath(
            item.preview
        );


    viewerImage.innerHTML =
        "";


    const image =
        document.createElement(
            "img"
        );


    image.src =
        imagePath;


    image.alt =
        item.title || "";


    image.onerror =
        function() {

            viewerImage.innerHTML = `

                <div style="
                    color:#aaa;
                    text-align:center;
                    padding:20px;
                ">

                    Image could not be loaded.

                    <br><br>

                    ${escapeHTML(
                        imagePath
                    )}

                </div>

            `;

        };


    viewerImage.appendChild(
        image
    );


    viewerTitle.textContent =
        item.title || "";


    viewerCategory.textContent =
        item.category ||
        "Automotive";


    download.href =
        imagePath;


    download.download =
        item.preview;


    viewer.classList.add(
        "active"
    );


    document.body.style.overflow =
        "hidden";

}


/* =========================
   CLOSE VIEWER
========================= */

function closeViewer() {

    viewer.classList.remove(
        "active"
    );


    document.body.style.overflow =
        "";

}


/* =========================
   NEXT WALLPAPER
========================= */

function nextWallpaper() {

    if (
        !currentWallpaper ||
        visibleWallpapers.length === 0
    ) {
        return;
    }


    const index =
        visibleWallpapers.indexOf(
            currentWallpaper
        );


    const nextIndex =
        (
            index + 1
        ) %
        visibleWallpapers.length;


    openViewer(
        visibleWallpapers[
            nextIndex
        ]
    );

}


/* =========================
   PREVIOUS WALLPAPER
========================= */

function previousWallpaper() {

    if (
        !currentWallpaper ||
        visibleWallpapers.length === 0
    ) {
        return;
    }


    const index =
        visibleWallpapers.indexOf(
            currentWallpaper
        );


    const previousIndex =
        (
            index -
            1 +
            visibleWallpapers.length
        ) %
        visibleWallpapers.length;


    openViewer(
        visibleWallpapers[
            previousIndex
        ]
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================
   EVENTS
========================= */

search.addEventListener(
    "input",
    render
);


sort.addEventListener(
    "change",
    render
);


close.addEventListener(
    "click",
    closeViewer
);


next.addEventListener(
    "click",
    nextWallpaper
);


previous.addEventListener(
    "click",
    previousWallpaper
);


/* Click outside viewer */

viewer.addEventListener(
    "click",
    function(event) {

        if (
            event.target === viewer
        ) {

            closeViewer();

        }

    }
);


/* Keyboard controls */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            !viewer.classList.contains(
                "active"
            )
        ) {
            return;
        }


        if (
            event.key === "Escape"
        ) {

            closeViewer();

        }


        if (
            event.key === "ArrowRight"
        ) {

            nextWallpaper();

        }


        if (
            event.key === "ArrowLeft"
        ) {

            previousWallpaper();

        }

    }
);


/* =========================
   START WEBSITE
========================= */

loadWallpapers();

</script>

</body>
</html>
